name: Security

# Проверки безопасности, которые должны идти сами, а не «когда вспомнили».
# Раз в неделю — потому что уязвимость находят не в день, когда мы правим код:
# зависимость может стать опасной, пока в репозитории вообще ничего не менялось.

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # каждый понедельник, 06:00 UTC (09:00 МСК)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Секреты в истории
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # нужна ВСЯ история: удалить файл мало, коммит остаётся

      - name: Поиск секретов (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

  python-deps:
    name: Уязвимости зависимостей (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: pip-audit
        run: pip-audit -r backend/requirements.txt --progress-spinner off

  js-deps:
    name: Уязвимости зависимостей (npm)
    runs-on: ubuntu-latest
    # Без потолка чужой сбой висит сколько угодно: реестр npm однажды отвечал
    # 503 семь минут подряд и всё это время держал слияние.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tma
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tma/package-lock.json
      - run: npm ci
      # Проверяем то, что реально уезжает пользователю: dev-инструменты в
      # браузер не попадают, и падать из-за них незачем.
      #
      # Три попытки, потому что проверка ходит на чужой сервер. Реестр npm
      # отвечал 503 на оба прогона подряд — уязвимости при этом не нашли, её
      # просто НЕ ИСКАЛИ, а красная галочка выглядела одинаково.
      #
      # Молча пропускать нельзя: проверка безопасности, которая тихо
      # соглашается, когда не смогла проверить, хуже отсутствующей. Поэтому
      # после трёх попыток всё равно падаем — но с текстом, из которого видно,
      # что произошло: «сервис недоступен», а не «найдена уязвимость».
      - name: npm audit (прод-зависимости)
        run: |
          # Потолок на КАЖДУЮ попытку, а не на проверку целиком. Сама команда
          # при сбое реестра висит около семи минут, и три попытки в общий
          # десятиминутный потолок просто не помещались — задание отменялось
          # на середине второй, без внятного сообщения.
          attempt=1
          while [ "$attempt" -le 3 ]; do
            echo "── попытка $attempt из 3"
            set +e
            out=$(timeout 120 npm audit --omit=dev --audit-level=moderate 2>&1)
            code=$?
            set -e
            echo "$out"

            if [ "$code" -eq 0 ]; then
              echo "✅ Уязвимостей уровня moderate и выше нет."
              exit 0
            fi

            # Сетевой сбой на чужой стороне: перебираем. Список узкий
            # намеренно. Раньше сюда попадала любая строка «audit endpoint
            # returned an error», а её выдаёт и ответ 400 «Invalid package
            # tree» — то есть рассинхрон package-lock.json. Это НАША поломка,
            # и повторять её три раза, а потом объявить сбоем реестра, значит
            # спрятать настоящую причину.
            if [ "$code" -eq 124 ] || echo "$out" | grep -qiE "503|Service Unavailable|ENOTFOUND|ETIMEDOUT|ECONNRESET|socket hang up"; then
              [ "$code" -eq 124 ] && echo "⚠️  Реестр npm не ответил за 120 секунд."
              echo "⚠️  Сбой на стороне реестра. Это не находка — проверка не состоялась."
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 15))
                attempt=$((attempt + 1))
                continue
              fi
              echo "::error::Проверка уязвимостей НЕ СОСТОЯЛАСЬ: реестр npm недоступен после трёх попыток. Это не значит, что уязвимость есть — значит, её не искали. Перезапустите проверку позже."
              exit 1
            fi

            echo "::error::Проверка не прошла. Если выше список пакетов — найдены уязвимости в прод-зависимостях. Если «Invalid package tree» — рассинхрон package-lock.json, нужен npm install."
            exit 1
          done

  codeql:
    name: Анализ кода (CodeQL)
    runs-on: ubuntu-latest
    # CodeQL бесплатен для публичных репозиториев. Если сделать репозиторий
    # приватным, он станет платным и job начнёт падать — не блокируем из-за
    # этого остальные проверки, они важнее и работают всегда.
    continue-on-error: true
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript-typescript"]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4

  gate:
    # ЗАЧЕМ ЭТА РАБОТА ВООБЩЕ НУЖНА.
    #
    # Сам по себе CodeQL не блокирует НИЧЕГО. Он загружает находки в раздел
    # Security и завершается успехом, а у работы выше вдобавок стоит
    # continue-on-error. То есть зелёная галочка «Анализ кода» не значит «всё
    # чисто» — она значит «анализ отработал», хоть с десятком критических
    # находок внутри. Заметить их можно, только зайдя в Security вручную, а
    # туда не заходят.
    #
    # Здесь находки читаются через API и критические роняют сборку.
    name: Критические находки не проходят
    needs: [codeql]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      security-events: read
      contents: read
    steps:
      - name: Прочитать находки и решить
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # ИМЕННО ЭТА ВЕТКА, а не основная.
          #
          # Первая версия спрашивала находки без ref — то есть про основную
          # ветку. Она честно ответила «0», проверка позеленела, а собственная
          # проверка GitHub в тот же момент показала «1 high, внесена этим
          # запросом». Находки запроса живут на refs/pull/N/merge, и без ref
          # сторож смотрел мимо того, что сам должен ловить: он проходил не
          # потому, что чисто, а потому, что спрашивал не про то место.
          REF: ${{ github.ref }}
        run: |
          set -uo pipefail
          ask() {
            gh api "repos/$REPO/code-scanning/alerts?state=open&per_page=100&ref=$1" \
              > "$2" 2>err.txt
          }
          # Находки доезжают до API не мгновенно: работа выше только что их
          # загрузила. Без ожидания сторож иногда видел бы пустой список сразу
          # после анализа — и это опять был бы зелёный цвет по неверной причине.
          ok=1
          for attempt in 1 2 3 4 5; do
            if ask "$REF" alerts.json; then ok=0; break; fi
            echo "Попытка $attempt: находки ещё не доступны, жду 20 с"
            sleep 20
          done
          # Отделяем «находок нет» от «проверка не состоялась». Второе бывает
          # у приватного репозитория без GitHub Advanced Security: API отвечает
          # 403/404, и молча зеленеть в этом случае — то же самое враньё, от
          # которого мы уходим.
          if [ "$ok" -ne 0 ]; then
            echo "::notice::Разбор находок не состоялся — код-сканирование недоступно"
            echo "Ответ GitHub:"; cat err.txt
            echo "Это НЕ значит «находок нет». Для приватного репозитория"
            echo "код-сканирование требует GitHub Advanced Security."
            exit 0
          fi

          total=$(jq 'length' alerts.json)
          echo "Открытых находок на $REF: $total"
          jq -r '.[] | "  · \(.rule.security_severity_level // "—"): \(.rule.description) — \(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line)"' alerts.json

          bad=$(jq '[.[] | select(.rule.security_severity_level == "critical"
                                  or .rule.security_severity_level == "high")]' alerts.json)
          n=$(echo "$bad" | jq 'length')
          if [ "$n" -gt 0 ]; then
            echo "::error::CodeQL нашёл $n критических/высоких проблем"
            exit 1
          fi
          echo "Критических и высоких: 0"
