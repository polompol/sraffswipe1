name: Security

# Проверки безопасности, которые должны идти сами, а не «когда вспомнили».
# Раз в неделю — потому что уязвимость находят не в день, когда мы правим код:
# зависимость может стать опасной, пока в репозитории вообще ничего не менялось.

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # каждый понедельник, 06:00 UTC (09:00 МСК)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Секреты в истории
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # нужна ВСЯ история: удалить файл мало, коммит остаётся

      - name: Поиск секретов (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

  python-deps:
    name: Уязвимости зависимостей (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: pip-audit
        run: pip-audit -r backend/requirements.txt --progress-spinner off

  js-deps:
    name: Уязвимости зависимостей (npm)
    runs-on: ubuntu-latest
    # Без потолка чужой сбой висит сколько угодно: реестр npm однажды отвечал
    # 503 семь минут подряд и всё это время держал слияние.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tma
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tma/package-lock.json
      - run: npm ci
      # Проверяем то, что реально уезжает пользователю: dev-инструменты в
      # браузер не попадают, и падать из-за них незачем.
      #
      # Три попытки, потому что проверка ходит на чужой сервер. Реестр npm
      # отвечал 503 на оба прогона подряд — уязвимости при этом не нашли, её
      # просто НЕ ИСКАЛИ, а красная галочка выглядела одинаково.
      #
      # Молча пропускать нельзя: проверка безопасности, которая тихо
      # соглашается, когда не смогла проверить, хуже отсутствующей. Поэтому
      # после трёх попыток всё равно падаем — но с текстом, из которого видно,
      # что произошло: «сервис недоступен», а не «найдена уязвимость».
      - name: npm audit (прод-зависимости)
        run: |
          # Потолок на КАЖДУЮ попытку, а не на проверку целиком. Сама команда
          # при сбое реестра висит около семи минут, и три попытки в общий
          # десятиминутный потолок просто не помещались — задание отменялось
          # на середине второй, без внятного сообщения.
          attempt=1
          while [ "$attempt" -le 3 ]; do
            echo "── попытка $attempt из 3"
            set +e
            out=$(timeout 120 npm audit --omit=dev --audit-level=moderate 2>&1)
            code=$?
            set -e
            echo "$out"

            if [ "$code" -eq 0 ]; then
              echo "✅ Уязвимостей уровня moderate и выше нет."
              exit 0
            fi

            # Сетевой сбой на чужой стороне: перебираем. Список узкий
            # намеренно. Раньше сюда попадала любая строка «audit endpoint
            # returned an error», а её выдаёт и ответ 400 «Invalid package
            # tree» — то есть рассинхрон package-lock.json. Это НАША поломка,
            # и повторять её три раза, а потом объявить сбоем реестра, значит
            # спрятать настоящую причину.
            if [ "$code" -eq 124 ] || echo "$out" | grep -qiE "503|Service Unavailable|ENOTFOUND|ETIMEDOUT|ECONNRESET|socket hang up"; then
              [ "$code" -eq 124 ] && echo "⚠️  Реестр npm не ответил за 120 секунд."
              echo "⚠️  Сбой на стороне реестра. Это не находка — проверка не состоялась."
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 15))
                attempt=$((attempt + 1))
                continue
              fi
              echo "::error::Проверка уязвимостей НЕ СОСТОЯЛАСЬ: реестр npm недоступен после трёх попыток. Это не значит, что уязвимость есть — значит, её не искали. Перезапустите проверку позже."
              exit 1
            fi

            echo "::error::Проверка не прошла. Если выше список пакетов — найдены уязвимости в прод-зависимостях. Если «Invalid package tree» — рассинхрон package-lock.json, нужен npm install."
            exit 1
          done

  codeql:
    name: Анализ кода (CodeQL)
    runs-on: ubuntu-latest
    # CodeQL бесплатен для публичных репозиториев. Если сделать репозиторий
    # приватным, он станет платным и job начнёт падать — не блокируем из-за
    # этого остальные проверки, они важнее и работают всегда.
    continue-on-error: true
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript-typescript"]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4
