name: Lifecycle green patch

on:
  push:
    branches: [codex/staffswipe-production-readiness]
    paths: [.github/workflows/zz-lifecycle-green.yml]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/staffswipe-production-readiness
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Apply lifecycle policy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          lifecycle = '''"""Authoritative, fail-closed match action policy.

          The API exposes these actions to the TMA so the client does not have to
          duplicate lifecycle rules and then discover a rejection after a tap.
          This helper is presentation guidance, not authorization: every endpoint
          still enforces the same rule server-side.
          """
          from datetime import UTC, datetime, timedelta

          from .models import Match, Vacancy
          from .timeutil import shift_end_utc, shift_start_utc

          _HOURS_EDIT_WINDOW = timedelta(hours=24)


          def allowed_match_actions(
              match: Match,
              role: str,
              vacancy: Vacancy | None,
              *,
              now: datetime | None = None,
          ) -> list[str]:
              """Return actions that are meaningful for this participant now.

              Time-dependent actions fail closed when the vacancy/time cannot be
              read.  That is deliberately stricter than guessing in the client.
              """
              if role not in {"seeker", "employer"}:
                  return []

              status = match.status
              actions: set[str] = set()

              # Confirmation itself is status-driven and remains available on a
              # matched record even if its scheduled time has passed: this keeps
              # the existing server semantics for late/stale clients, while
              # terminal records below can never be resurrected.
              if status == "matched":
                  already = (
                      match.confirmed_by_seeker
                      if role == "seeker"
                      else match.confirmed_by_employer
                  )
                  if not already:
                      actions.add("confirm")

              # A dispute is the recovery path for an active/closed/no-show
              # agreement.  A cancelled agreement has no forward actions.
              if status in {"matched", "confirmed", "completed", "expired"}:
                  if not match.disputed:
                      actions.add("dispute")

              if status == "cancelled" or match.disputed or vacancy is None:
                  return sorted(actions)

              current = now or datetime.now(UTC)
              try:
                  starts = shift_start_utc(
                      vacancy.date, vacancy.start_time, vacancy.city
                  )
                  ends = shift_end_utc(
                      vacancy.date,
                      vacancy.start_time,
                      vacancy.end_time,
                      vacancy.city,
                  )
              except (TypeError, ValueError):
                  # Unknown time must never unlock a time-sensitive control.
                  return sorted(actions)

              before_start = current < starts
              started = current >= starts
              ended = current >= ends
              untouched = not match.seeker_checked_in and not match.employer_checked_in

              if status in {"matched", "confirmed"} and before_start and untouched:
                  actions.add("cancel")
                  if role == "employer":
                      actions.add("propose_reschedule")
                  elif match.reschedule_date:
                      actions.update({"accept_reschedule", "decline_reschedule"})

              if status == "confirmed" and started:
                  if role == "seeker" and not match.seeker_checked_in:
                      actions.add("checkin")
                  if role == "employer" and not match.employer_checked_in:
                      actions.add("attendance")

              if status in {"matched", "confirmed"} and ended:
                  actions.add("not_held")

              if (
                  role == "employer"
                  and status in {"confirmed", "completed"}
                  and ended
                  and current - ends <= _HOURS_EDIT_WINDOW
              ):
                  actions.add("set_hours")

              return sorted(actions)
          '''
          Path('backend/app/match_lifecycle.py').write_text(lifecycle, encoding='utf-8')

          schemas = Path('backend/app/schemas.py')
          text = schemas.read_text(encoding='utf-8')
          old = '''    status: str\n    confirmed_by_seeker: bool\n'''
          new = '''    status: str\n    # Server-owned UI capabilities. Endpoints still authorize every action; this\n    # list prevents the TMA from offering a button the server would reject.\n    allowed_actions: list[str] = Field(default_factory=list)\n    confirmed_by_seeker: bool\n'''
          if old not in text:
              raise SystemExit('schemas MatchOut anchor not found')
          schemas.write_text(text.replace(old, new, 1), encoding='utf-8')

          matches = Path('backend/app/routers/matches.py')
          text = matches.read_text(encoding='utf-8')

          old = '''from ..db import get_db\nfrom ..models import (\n'''
          new = '''from ..db import get_db\nfrom ..match_lifecycle import allowed_match_actions\nfrom ..models import (\n'''
          if old not in text:
              raise SystemExit('matches import anchor not found')
          text = text.replace(old, new, 1)

          old = '''        status=m.status,\n        confirmed_by_seeker=m.confirmed_by_seeker,\n'''
          new = '''        status=m.status,\n        allowed_actions=allowed_match_actions(m, role, v),\n        confirmed_by_seeker=m.confirmed_by_seeker,\n'''
          if old not in text:
              raise SystemExit('_to_out anchor not found')
          text = text.replace(old, new, 1)

          old = '''    if principal["id"] not in (m.user_id, m.employer_id):\n        raise HTTPException(status_code=403, detail="Нет доступа к мэтчу")\n    if principal["role"] == "seeker":\n'''
          new = '''    if principal["id"] not in (m.user_id, m.employer_id):\n        raise HTTPException(status_code=403, detail="Нет доступа к мэтчу")\n    if m.status in {"cancelled", "completed", "expired"}:\n        raise HTTPException(\n            status_code=409,\n            detail="Эта смена уже закрыта — подтверждать её нельзя",\n        )\n    if principal["role"] == "seeker":\n'''
          if old not in text:
              raise SystemExit('confirm anchor not found')
          text = text.replace(old, new, 1)

          old = '''    if not m.reschedule_date:\n        raise HTTPException(status_code=404, detail="Переноса не предлагали")\n    m.reschedule_date = ""\n'''
          new = '''    if not m.reschedule_date:\n        raise HTTPException(status_code=404, detail="Переноса не предлагали")\n    if m.status not in ("matched", "confirmed"):\n        raise HTTPException(status_code=409, detail="Смена уже закрыта")\n    m.reschedule_date = ""\n'''
          # Only decline_reschedule lacks the guard. accept_reschedule already has
          # the same snippet followed by its own status guard, so replace the last
          # unguarded occurrence deterministically.
          idx = text.find(old, text.find('def decline_reschedule('))
          if idx < 0:
              raise SystemExit('decline reschedule anchor not found')
          text = text[:idx] + text[idx:].replace(old, new, 1)
          matches.write_text(text, encoding='utf-8')
          PY
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r bot/requirements.txt ruff pytest pypdf fakeredis moto
      - name: Verify lifecycle GREEN
        working-directory: backend
        run: |
          ruff check app tests/test_match_lifecycle_authorization.py
          pytest -q tests/test_match_lifecycle_authorization.py
      - name: Commit verified patch and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/zz-lifecycle-green.yml
          git config user.name staffswipe-ci
          git config user.email staffswipe-ci@users.noreply.github.com
          git add backend/app/match_lifecycle.py backend/app/schemas.py backend/app/routers/matches.py .github/workflows/zz-lifecycle-green.yml
          git commit -m "fix: enforce authoritative match lifecycle actions"
          git push origin HEAD:codex/staffswipe-production-readiness
