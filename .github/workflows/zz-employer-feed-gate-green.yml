name: Employer feed gate green patch
on: push
permissions:
  contents: write
jobs:
  patch-and-verify:
    if: github.actor != 'staffswipe-ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/staffswipe-production-readiness
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tma/package-lock.json
      - name: Apply employer prerequisite gate
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tma/src/features/feed/FeedPage.tsx')
          s = p.read_text()
          def rep(old, new):
              global s
              if old not in s:
                  raise SystemExit(f'anchor not found: {old[:120]!r}')
              s = s.replace(old, new, 1)

          rep('import { remainingFeedItems } from "./feedExhaustion";\n',
              'import { remainingFeedItems } from "./feedExhaustion";\nimport { employerFeedState } from "./employerFeedGate";\n')
          rep('  const { data: myVacs } = useQuery({\n    queryKey: ["my-vacancies"],\n    queryFn: fetchMyVacancies,\n    enabled: !isSeeker,\n  });\n  const employerNoVacancy = !isSeeker && myVacs != null && myVacs.length === 0;\n',
              '  const {\n    data: myVacs,\n    isLoading: myVacsLoading,\n    isError: myVacsError,\n    refetch: refetchMyVacs,\n  } = useQuery({\n    queryKey: ["my-vacancies"],\n    queryFn: fetchMyVacancies,\n    enabled: !isSeeker,\n  });\n  const employerGate = employerFeedState(\n    isSeeker, myVacs, myVacsLoading, myVacsError,\n  );\n  const employerNoVacancy = employerGate === "needs_vacancy";\n  const feedReady = employerGate === "ready";\n  const showFeedError = employerGate === "error"\n    || (employerGate !== "loading" && isError);\n  const showFeedLoading = !showFeedError\n    && (isLoading || employerGate === "loading");\n\n  function retryFeed() {\n    void refetch();\n    if (!isSeeker) void refetchMyVacs();\n  }\n')
          rep('  const deckMode =\n    !isLoading && !isError && !!visibleData && visibleData.length > 0\n    && !(isSeeker && view === "list");\n',
              '  const deckMode =\n    feedReady && !showFeedLoading && !showFeedError\n    && !!visibleData && visibleData.length > 0\n    && !(isSeeker && view === "list");\n')
          rep('      {isLoading && <SkeletonCard />}\n      {isError && <ErrorBox onRetry={() => refetch()} />}\n\n      {!isLoading && !isError && visibleData && visibleData.length === 0 && (\n',
              '      {showFeedLoading && <SkeletonCard />}\n      {showFeedError && <ErrorBox onRetry={retryFeed} />}\n\n      {feedReady && !showFeedLoading && !showFeedError\n        && visibleData && visibleData.length === 0 && (\n')
          rep('      {!isLoading && !isError && visibleData && visibleData.length > 0 && isSeeker && view === "list" && (\n',
              '      {feedReady && !showFeedLoading && !showFeedError\n        && visibleData && visibleData.length > 0 && isSeeker && view === "list" && (\n')
          rep('      {!isLoading && !isError && visibleData && visibleData.length > 0 && !(isSeeker && view === "list") && (\n',
              '      {feedReady && !showFeedLoading && !showFeedError\n        && visibleData && visibleData.length > 0 && !(isSeeker && view === "list") && (\n')
          p.write_text(s)
          PY
      - name: Install TMA dependencies
        working-directory: tma
        run: npm ci
      - name: Verify TMA GREEN
        working-directory: tma
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run build
      - name: Commit verified patch and remove helper workflow
        run: |
          rm .github/workflows/zz-employer-feed-gate-green.yml
          git config user.name staffswipe-ci
          git config user.email staffswipe-ci@users.noreply.github.com
          git add tma/src/features/feed/FeedPage.tsx tma/src/features/feed/employerFeedGate.ts tma/src/features/feed/employerFeedGate.test.ts .github/workflows/zz-employer-feed-gate-green.yml
          git commit -m "fix: gate employer candidate feed on vacancy prerequisite"
          git push origin HEAD:codex/staffswipe-production-readiness
