name: Refresh generated texts retry

on:
  push:
    branches:
      - codex/staffswipe-production-readiness
    paths:
      - .github/workflows/zz-texts-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/staffswipe-production-readiness
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/bot/requirements.txt
      - name: Regenerate from source
        run: python3 scripts/texts.py --write
      - name: Install standard backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/bot/requirements.txt pytest pypdf fakeredis moto
      - name: Verify official catalogue contract
        run: pytest -q backend/tests/test_texts_catalogue.py
      - name: Commit catalogue and remove helper
        run: |
          rm -f .github/workflows/zz-texts-refresh.yml
          git config user.name "staffswipe-ci"
          git config user.email "staffswipe-ci@users.noreply.github.com"
          git add docs/ТЕКСТЫ.md .github/workflows/zz-texts-refresh.yml
          git diff --cached --quiet && exit 1 || true
          git commit -m "docs: refresh generated text catalogue"
          git push origin HEAD:codex/staffswipe-production-readiness
