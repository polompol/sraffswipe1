name: Regenerate Task 4 text catalogue

on:
  push:
    branches:
      - codex/staffswipe-production-readiness

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/staffswipe-production-readiness
          fetch-depth: 0
      - name: Regenerate catalogue
        run: python3 scripts/texts.py --write
      - name: Commit catalogue and remove runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/task4-texts.yml
          git add docs/ТЕКСТЫ.md
          git diff --cached --check
          git commit -m "docs: regenerate text catalogue for support workflow"
          git push origin HEAD:codex/staffswipe-production-readiness
