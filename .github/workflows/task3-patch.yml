name: Apply Task 3 guarded patch

on:
  push:
    branches:
      - codex/staffswipe-production-readiness

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: run task 3 patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/staffswipe-production-readiness
          fetch-depth: 0

      - name: Apply guarded contract and UX fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # API contract: destructive/final admin actions carry the audited reason.
          replace_once(
              "tma/src/api/endpoints.ts",
              '''export async function resolveMatch(\n  matchId: string,\n  outcome: "completed" | "no_show",\n): Promise<void> {\n  if (!USE_BACKEND) return mock.resolveMatch(matchId, outcome);\n  await api.post(`/matches/${matchId}/resolve`, { outcome });\n}\n\n/** Заблокировать пользователя (соискателя/работодателя). */\nexport async function blockUser(userId: string): Promise<void> {\n  if (!USE_BACKEND) return mock.resolveReport("");\n  await api.post(`/admin/users/${userId}/block`, {});\n}\n\n/** Снять вакансию (фейк/обман) с публикации. */\nexport async function blockVacancy(vacancyId: string): Promise<void> {\n  if (!USE_BACKEND) return mock.resolveReport("");\n  await api.post(`/admin/vacancies/${vacancyId}/block`, {});\n}''',
              '''export async function resolveMatch(\n  matchId: string,\n  outcome: "completed" | "no_show",\n  reason: string,\n): Promise<void> {\n  if (!USE_BACKEND) return mock.resolveMatch(matchId, outcome);\n  await api.post(`/matches/${matchId}/resolve`, { outcome, reason });\n}\n\n/** Заблокировать пользователя (соискателя/работодателя). */\nexport async function blockUser(userId: string, reason: string): Promise<void> {\n  if (!USE_BACKEND) return mock.resolveReport("");\n  await api.post(`/admin/users/${userId}/block`, { reason });\n}\n\n/** Снять вакансию (фейк/обман) с публикации. */\nexport async function blockVacancy(vacancyId: string, reason: string): Promise<void> {\n  if (!USE_BACKEND) return mock.resolveReport("");\n  await api.post(`/admin/vacancies/${vacancyId}/block`, { reason });\n}''',
          )

          # TodayTab: require explicit confirmation plus a non-blank reason.
          replace_once(
              "tma/src/features/admin/TodayTab.tsx",
              'import { Button } from "@/components/Button";\n',
              'import { Button } from "@/components/Button";\nimport { Sheet } from "@/components/Sheet";\n',
          )
          replace_once(
              "tma/src/features/admin/TodayTab.tsx",
              '''const PERIODS: { id: string; label: string; days: number }[] = [\n  { id: "today", label: "Сегодня", days: 1 },\n  { id: "week", label: "7 дней", days: 7 },\n  { id: "all", label: "Всё время", days: 0 },\n];\n''',
              '''const PERIODS: { id: string; label: string; days: number }[] = [\n  { id: "today", label: "Сегодня", days: 1 },\n  { id: "week", label: "7 дней", days: 7 },\n  { id: "all", label: "Всё время", days: 0 },\n];\n\ntype PendingAdminAction =\n  | { kind: "block-user"; targetId: string }\n  | { kind: "block-vacancy"; targetId: string }\n  | {\n      kind: "resolve-match";\n      reportId: string;\n      matchId: string;\n      outcome: "completed" | "no_show";\n    };\n''',
          )
          replace_once(
              "tma/src/features/admin/TodayTab.tsx",
              '''  const [replies, setReplies] = useState<Record<string, string>>({});\n  const refresh = useAdminRefresh();''',
              '''  const [replies, setReplies] = useState<Record<string, string>>({});\n  const [pendingAction, setPendingAction] = useState<PendingAdminAction | null>(null);\n  const [actionReason, setActionReason] = useState("");\n  const [actionBusy, setActionBusy] = useState(false);\n  const refresh = useAdminRefresh();''',
          )
          replace_once(
              "tma/src/features/admin/TodayTab.tsx",
              '''  async function resolveDispute(\n    reportId: string,\n    matchId: string,\n    outcome: "completed" | "no_show",\n  ) {\n    const ok = await act(\n      async () => {\n        await resolveMatch(matchId, outcome);\n        await resolveReport(reportId);\n      },\n      outcome === "completed" ? "Смена засчитана" : "Зафиксирована неявка",\n      "Не удалось закрыть спор",\n    );\n    if (ok) refresh();\n  }\n''',
              '''  function openAdminAction(action: PendingAdminAction) {\n    setActionReason("");\n    setPendingAction(action);\n  }\n\n  function closeAdminAction() {\n    if (actionBusy) return;\n    setPendingAction(null);\n    setActionReason("");\n  }\n\n  async function confirmAdminAction() {\n    const action = pendingAction;\n    const reason = actionReason.trim();\n    if (!action || !reason || actionBusy) return;\n\n    setActionBusy(true);\n    try {\n      let ok = false;\n      if (action.kind === "block-user") {\n        ok = await act(\n          () => blockUser(action.targetId, reason),\n          "Пользователь заблокирован",\n          "Не удалось заблокировать",\n        );\n      } else if (action.kind === "block-vacancy") {\n        ok = await act(\n          () => blockVacancy(action.targetId, reason),\n          "Смена снята с публикации",\n          "Не удалось снять смену",\n        );\n      } else {\n        ok = await act(\n          async () => {\n            await resolveMatch(action.matchId, action.outcome, reason);\n            await resolveReport(action.reportId);\n          },\n          action.outcome === "completed" ? "Смена засчитана" : "Зафиксирована неявка",\n          "Не удалось закрыть спор",\n        );\n      }\n      if (!ok) return;\n      setPendingAction(null);\n      setActionReason("");\n      refresh();\n    } finally {\n      setActionBusy(false);\n    }\n  }\n''',
          )
          replace_once(
              "tma/src/features/admin/TodayTab.tsx",
              '''  async function blockTarget(type: string, targetId: string) {\n    const ok = await act(\n      () => (type === "vacancy" ? blockVacancy(targetId) : blockUser(targetId)),\n      type === "vacancy" ? "Смена снята с публикации" : "Пользователь заблокирован",\n      "Не удалось заблокировать",\n    );\n    if (ok) refresh();\n  }\n\n''',
              '',
          )
          replace_once(
              "tma/src/features/admin/TodayTab.tsx",
              '<Button variant="danger" onClick={() => blockTarget("vacancy", r.targetId)}>',
              '<Button variant="danger" onClick={() => openAdminAction({ kind: "block-vacancy", targetId: r.targetId })}>',
          )
          replace_once(
              "tma/src/features/admin/TodayTab.tsx",
              '<Button variant="danger" onClick={() => blockTarget("user", r.targetId)}>',
              '<Button variant="danger" onClick={() => openAdminAction({ kind: "block-user", targetId: r.targetId })}>',
          )
          replace_once(
              "tma/src/features/admin/TodayTab.tsx",
              '<Button onClick={() => resolveDispute(r.id, r.targetId, "completed")}>',
              '<Button onClick={() => openAdminAction({ kind: "resolve-match", reportId: r.id, matchId: r.targetId, outcome: "completed" })}>',
          )
          replace_once(
              "tma/src/features/admin/TodayTab.tsx",
              'onClick={() => resolveDispute(r.id, r.targetId, "no_show")}',
              'onClick={() => openAdminAction({ kind: "resolve-match", reportId: r.id, matchId: r.targetId, outcome: "no_show" })}',
          )
          replace_once(
              "tma/src/features/admin/TodayTab.tsx",
              '''      </div>\n    </>\n  );\n}''',
              '''      </div>\n\n      {pendingAction && (\n        <Sheet\n          title={\n            pendingAction.kind === "block-user"\n              ? "Заблокировать пользователя?"\n              : pendingAction.kind === "block-vacancy"\n                ? "Снять смену?"\n                : pendingAction.outcome === "completed"\n                  ? "Засчитать смену?"\n                  : "Зафиксировать неявку?"\n          }\n          onClose={closeAdminAction}\n          footer={\n            <div className="stack">\n              <Button\n                variant="danger"\n                loading={actionBusy}\n                disabled={!actionReason.trim()}\n                onClick={confirmAdminAction}\n              >\n                {pendingAction.kind === "block-user"\n                  ? "Заблокировать"\n                  : pendingAction.kind === "block-vacancy"\n                    ? "Снять смену"\n                    : pendingAction.outcome === "completed"\n                      ? "Засчитать"\n                      : "Зафиксировать"}\n              </Button>\n              <Button variant="ghost" disabled={actionBusy} onClick={closeAdminAction}>\n                Отмена\n              </Button>\n            </div>\n          }\n        >\n          <p className="muted" style={{ marginTop: 0 }}>\n            Причина обязательна и сохранится в журнале действий оператора.\n          </p>\n          <label htmlFor="admin-action-reason" style={{ display: "block", marginBottom: 6 }}>\n            Причина\n          </label>\n          <textarea\n            id="admin-action-reason"\n            className="input"\n            value={actionReason}\n            maxLength={1000}\n            rows={4}\n            disabled={actionBusy}\n            onChange={(e) => setActionReason(e.target.value)}\n            style={{ width: "100%", resize: "vertical" }}\n          />\n        </Sheet>\n      )}\n    </>\n  );\n}''',
          )

          # Legacy backend regression tests: make the new reason contract explicit.
          replace_once(
              "backend/tests/test_abuse_channels.py",
              '''    assert client.post(\n        f"/admin/vacancies/{vac['id']}/block", headers=ah\n    ).status_code == 200''',
              '''    assert client.post(\n        f"/admin/vacancies/{vac['id']}/block",\n        headers=ah,\n        json={"reason": "подозрительная смена"},\n    ).status_code == 200''',
          )
          replace_once(
              "backend/tests/test_extra.py",
              '''    bv = client.post(f"/admin/vacancies/{vac['id']}/block", headers=ah)''',
              '''    bv = client.post(\n        f"/admin/vacancies/{vac['id']}/block",\n        headers=ah,\n        json={"reason": "тестовая блокировка смены"},\n    )''',
          )
          replace_once(
              "backend/tests/test_extra.py",
              '''    assert client.post(f"/admin/users/{eid}/block", headers=ah).status_code == 200''',
              '''    assert client.post(\n        f"/admin/users/{eid}/block",\n        headers=ah,\n        json={"reason": "тестовая блокировка пользователя"},\n    ).status_code == 200''',
          )
          replace_once(
              "backend/tests/test_extra.py",
              '''    client.post(f"/admin/users/{eid}/block", headers=ah)''',
              '''    client.post(\n        f"/admin/users/{eid}/block",\n        headers=ah,\n        json={"reason": "немедленная блокировка активной сессии"},\n    )''',
          )
          replace_once(
              "backend/tests/test_extra.py",
              '''    client.post(f"/admin/users/{sid}/block", headers=ah)''',
              '''    client.post(\n        f"/admin/users/{sid}/block",\n        headers=ah,\n        json={"reason": "проверка разблокировки"},\n    )''',
          )
          replace_once(
              "backend/tests/test_features.py",
              '''    assert client.post(f"/matches/{match_id}/resolve", headers=_hdr(outsider),\n                       json={"outcome": "no_show"}).status_code == 403\n    r = client.post(f"/matches/{match_id}/resolve", headers=ah,\n                    json={"outcome": "no_show"})''',
              '''    assert client.post(f"/matches/{match_id}/resolve", headers=_hdr(outsider),\n                       json={"outcome": "no_show", "reason": "проверка полномочий"}).status_code == 403\n    r = client.post(f"/matches/{match_id}/resolve", headers=ah,\n                    json={"outcome": "no_show", "reason": "оператор подтвердил неявку"})''',
          )
          replace_once(
              "backend/tests/test_features.py",
              '''    r = client.post(f"/matches/{match_id}/resolve", headers=ah,\n                    json={"outcome": "completed"})''',
              '''    r = client.post(f"/matches/{match_id}/resolve", headers=ah,\n                    json={"outcome": "completed", "reason": "оператор подтвердил выход"})''',
          )
          replace_once(
              "backend/tests/test_role_crossing.py",
              '''    assert client.post(f"/admin/users/{eid}/block",\n                       headers=admin_h).status_code == 200''',
              '''    assert client.post(\n        f"/admin/users/{eid}/block",\n        headers=admin_h,\n        json={"reason": "тест переноса бана между ролями"},\n    ).status_code == 200''',
          )
          replace_once(
              "backend/tests/test_role_crossing.py",
              '''    assert client.post(f"/admin/users/{sid}/block",\n                       headers=admin_h).status_code == 200''',
              '''    assert client.post(\n        f"/admin/users/{sid}/block",\n        headers=admin_h,\n        json={"reason": "тест запрета обхода через вторую роль"},\n    ).status_code == 200''',
          )
          replace_once(
              "backend/tests/test_settlement_abuse.py",
              '''    r = client.post(f"/matches/{mid}/resolve", headers=admin_h,\n                    json={"outcome": "no_show"})''',
              '''    r = client.post(f"/matches/{mid}/resolve", headers=admin_h,\n                    json={"outcome": "no_show", "reason": "оператор подтвердил неявку"})''',
          )

          # E2E seed must follow the same production contract.
          replace_once(
              "e2e/tests/admin.spec.ts",
              '''  await request.post(`${API_URL}/admin/users/${seeker.id}/block`, {\n    headers: auth(admin),\n  });''',
              '''  await request.post(`${API_URL}/admin/users/${seeker.id}/block`, {\n    headers: auth(admin),\n    data: { reason: "E2E: проверка блокировки" },\n  });''',
          )
          PY

          python3 scripts/texts.py --write
          git diff --check
          git status --short

      - name: Commit guarded patch and remove runner
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/task3-patch.yml
          git add backend/tests tma/src/api/endpoints.ts tma/src/features/admin/TodayTab.tsx e2e/tests/admin.spec.ts docs/ТЕКСТЫ.md
          git diff --cached --check
          git commit -m "fix: complete destructive admin action hardening"
          git push origin HEAD:codex/staffswipe-production-readiness
