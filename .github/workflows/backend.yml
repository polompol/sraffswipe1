name: Backend CI

on:
  push:
    branches: ["**"]
    # Типы приложения тоже здесь: договор «сервер шлёт — приложение читает»
    # проверяется тестом на стороне сервера, и сломать его можно с любой из
    # двух сторон (см. backend/tests/test_contract_with_app.py).
    paths:
      - "backend/**"
      - "tma/src/types/**"
      - "tma/src/api/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "tma/src/types/**"
      - "tma/src/api/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    name: Lint & test (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Redis для тестов общего состояния
        run: sudo apt-get update -qq && sudo apt-get install -y -qq redis-server

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff pytest pypdf fakeredis moto

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  postgres:
    # Второй прогон того же набора — на настоящей базе, как на сервере.
    # SQLite прощает многое (например, не проверяет внешние ключи), и целый
    # класс расхождений виден только здесь. Схему накатывают миграции — тем же
    # путём, что и в бою.
    name: Тесты на PostgreSQL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: staffswipe_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Redis для тестов общего состояния
        run: sudo apt-get update -qq && sudo apt-get install -y -qq redis-server

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pypdf fakeredis moto

      - name: Test
        # Драйвер тот же, что в проде (psycopg3): иначе проверяется не то
        # соединение, с которым сервис работает на сервере.
        env:
          STAFFSWIPE_TEST_DB: postgresql+psycopg://postgres:postgres@localhost:5432/staffswipe_test
        run: pytest -q
