name: Temporary refresh backend generated docs

on:
  push:
    branches:
      - codex/staffswipe-production-readiness

permissions:
  contents: write

jobs:
  refresh-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/staffswipe-production-readiness
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Fix test imports and regenerate text catalogue
        run: |
          python -m pip install ruff
          cd backend
          ruff check tests/test_match_lifecycle_authorization.py --fix
          python3 scripts/texts.py --write
          cd ..
      - name: Commit verified generated changes and remove temporary workflow
        run: |
          rm .github/workflows/_tmp_refresh_backend_docs.yml
          git config user.name 'staffswipe-ci'
          git config user.email 'staffswipe-ci@users.noreply.github.com'
          git add backend/tests/test_match_lifecycle_authorization.py backend/docs/ТЕКСТЫ.md .github/workflows/_tmp_refresh_backend_docs.yml
          git diff --cached --quiet && exit 0
          git commit -m 'chore(lifecycle): refresh backend generated checks'
          git push origin HEAD:codex/staffswipe-production-readiness
