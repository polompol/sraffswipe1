name: Apply chat hardening patch

on:
  push:
    branches: [codex/staffswipe-chat-hardening]
    paths: [.github/workflows/chat-hardening-apply.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/staffswipe-chat-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tma/package-lock.json
      - name: Apply bounded chat patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected snippet not found in {path}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "tma/src/api/endpoints.ts",
              '''export async function sendMessage(\n  matchId: string,\n  text: string,\n): Promise<Message> {\n  if (!USE_BACKEND) return mock.sendMessage(matchId, text);\n  const { data } = await api.post<Message>(`/matches/${matchId}/messages`, {\n    text,\n  });\n  return data;\n}\n''',
              '''export async function sendMessage(\n  matchId: string,\n  text: string,\n  clientMessageId: string,\n): Promise<Message> {\n  if (!USE_BACKEND) {\n    const message = await mock.sendMessage(matchId, text);\n    return { ...message, clientMessageId };\n  }\n  const { data } = await api.post<Message>(`/matches/${matchId}/messages`, {\n    text,\n    client_message_id: clientMessageId,\n  });\n  return data;\n}\n''',
          )

          replace(
              "tma/src/types/domain.ts",
              '''  createdAt: string;\n}\n''',
              '''  createdAt: string;\n  /** Идемпотентный receipt клиента: связывает retry/outbox с серверной записью. */\n  clientMessageId?: string;\n}\n''',
          )

          replace(
              "tma/src/features/chat/useChatSocket.ts",
              '''          createdAt: raw.created_at ?? new Date().toISOString(),\n''',
              '''          createdAt: raw.created_at ?? new Date().toISOString(),\n          clientMessageId: raw.client_message_id ?? undefined,\n''',
          )

          replace(
              "tma/src/features/chat/ChatPage.tsx",
              '''import { useChatSocket } from "./useChatSocket";\n''',
              '''import { useChatSocket } from "./useChatSocket";\nimport {\n  clearChatDraft,\n  markChatMessageFailed,\n  markChatMessageSending,\n  queueChatMessage,\n  readChatDraft,\n  removeChatOutboxItem,\n  restoreChatOutbox,\n  writeChatDraft,\n  type ChatOutboxItem,\n} from "./chatPersistence";\n''',
          )

          replace(
              "tma/src/features/chat/ChatPage.tsx",
              '''  const [text, setText] = useState("");\n''',
              '''  const [text, setText] = useState(() => readChatDraft(matchId));\n  const [outbox, setOutbox] = useState<ChatOutboxItem[]>(() =>\n    restoreChatOutbox(matchId),\n  );\n''',
          )

          replace(
              "tma/src/features/chat/ChatPage.tsx",
              '''  useEffect(() => showBackButton(() => nav(-1)), [nav]);\n\n  const {\n''',
              '''  useEffect(() => showBackButton(() => nav(-1)), [nav]);\n\n  useEffect(() => {\n    setText(readChatDraft(matchId));\n    setOutbox(restoreChatOutbox(matchId));\n  }, [matchId]);\n\n  useEffect(() => {\n    writeChatDraft(matchId, text);\n  }, [matchId, text]);\n\n  const {\n''',
          )

          replace(
              "tma/src/features/chat/ChatPage.tsx",
              '''  const mySent = new Set(\n''',
              '''  useEffect(() => {\n    if (!messages) return;\n    setOutbox(restoreChatOutbox(matchId, messages));\n  }, [matchId, messages]);\n\n  const mySent = new Set(\n''',
          )

          replace(
              "tma/src/features/chat/ChatPage.tsx",
              '''  async function deliver(t: string) {\n    try {\n      const msg = await sendMessage(matchId, t);\n      appendMessage(msg); // мгновенно показываем; WS-echo дедуплицируется\n    } catch {\n      haptic("error");\n      setText(t); // вернуть текст, чтобы не потерять сообщение\n      toast("Не отправилось — нажмите отправить ещё раз", "error");\n    }\n  }\n\n  async function send() {\n    const t = text.trim();\n    if (!t) return;\n    setText("");\n    await deliver(t);\n  }\n\n  function quickReply(t: string) {\n    haptic("light");\n    void deliver(t);\n  }\n''',
              '''  async function deliver(t: string, retryId?: string) {\n    const clientMessageId = retryId ?? crypto.randomUUID();\n    const pending = retryId\n      ? markChatMessageSending(matchId, clientMessageId)\n      : queueChatMessage(matchId, t, clientMessageId);\n    if (!pending) return;\n    setOutbox((current) => [\n      ...current.filter((row) => row.clientMessageId !== clientMessageId),\n      pending,\n    ]);\n\n    try {\n      const msg = await sendMessage(matchId, t, clientMessageId);\n      appendMessage(msg); // мгновенно показываем; WS-echo дедуплицируется\n      removeChatOutboxItem(matchId, clientMessageId);\n      setOutbox((current) =>\n        current.filter((row) => row.clientMessageId !== clientMessageId),\n      );\n    } catch {\n      haptic("error");\n      const failed = markChatMessageFailed(matchId, clientMessageId);\n      if (failed) {\n        setOutbox((current) => current.map((row) =>\n          row.clientMessageId === clientMessageId ? failed : row,\n        ));\n      }\n      toast("Не отправилось — сообщение сохранено для повтора", "error");\n    }\n  }\n\n  async function send() {\n    const t = text.trim();\n    if (!t) return;\n    setText("");\n    clearChatDraft(matchId);\n    await deliver(t);\n  }\n\n  function quickReply(t: string) {\n    haptic("light");\n    void deliver(t);\n  }\n''',
          )

          replace(
              "tma/src/features/chat/ChatPage.tsx",
              '''        {messages?.map((m: Message) => {\n          if (m.isSystem) return <div key={m.id} className="bubble system">{m.text}</div>;\n          const mine = m.senderId === (myId ?? "me");\n          return (\n            <div key={m.id} className={`bubble ${mine ? "mine" : "theirs"}`}>\n              {m.text}\n              <span className="bubble-at">{msgTime(m.createdAt)}</span>\n            </div>\n          );\n        })}\n''',
              '''        {messages?.map((m: Message) => {\n          if (m.isSystem) return <div key={m.id} className="bubble system">{m.text}</div>;\n          const mine = m.senderId === (myId ?? "me");\n          return (\n            <div key={m.id} className={`bubble ${mine ? "mine" : "theirs"}`}>\n              {m.text}\n              <span className="bubble-at">{msgTime(m.createdAt)}</span>\n            </div>\n          );\n        })}\n        {outbox.map((pending) => (\n          <div\n            key={pending.clientMessageId}\n            className="bubble mine"\n            style={{ opacity: pending.status === "sending" ? 0.68 : 1 }}\n          >\n            {pending.text}\n            <span className="bubble-at">\n              {pending.status === "sending" ? (\n                "Отправляем…"\n              ) : (\n                <button\n                  type="button"\n                  className="text-btn"\n                  style={{ fontSize: "inherit", padding: 0 }}\n                  onClick={() => void deliver(pending.text, pending.clientMessageId)}\n                >\n                  Не отправилось · Повторить\n                </button>\n              )}\n            </span>\n          </div>\n        ))}\n''',
          )
          PY

      - name: Install TMA dependencies
        working-directory: tma
        run: npm ci
      - name: Verify TMA
        working-directory: tma
        run: npm run lint && npm run typecheck && npm run test && npm run build
      - name: Commit patch
        run: |
          git config user.name "StaffSwipe CI"
          git config user.email "actions@users.noreply.github.com"
          git add tma/src/api/endpoints.ts tma/src/types/domain.ts tma/src/features/chat/useChatSocket.ts tma/src/features/chat/ChatPage.tsx
          git commit -m "feat: make chat retries idempotent in TMA"
          git push origin HEAD:codex/staffswipe-chat-hardening
