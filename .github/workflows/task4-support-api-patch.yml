name: Apply Task 4 support API patch

on:
  push:
    branches:
      - codex/staffswipe-production-readiness

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/staffswipe-production-readiness
          fetch-depth: 0
      - name: Apply guarded patch
        shell: bash
        run: echo '' | base64 -d | python3
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/task4-support-api-patch.yml
          git add tma/src/api/endpoints.ts tma/src/api/mock.ts
          git diff --cached --check
          git commit -m "feat(tma): add support case API contracts"
          git push origin HEAD:codex/staffswipe-production-readiness
