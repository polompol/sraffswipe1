name: Admin audit RED

on:
  push:
    branches:
      - codex/staffswipe-production-readiness
    paths:
      - .github/workflows/zz-admin-audit-red.yml

jobs:
  red:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install targeted dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Show real Alembic head
        run: python -m alembic heads
      - name: Run admin audit contract
        run: pytest -q tests/test_admin_audit.py
