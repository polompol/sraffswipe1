name: Temporary verify dispute and cancel serialization

on:
  push:
    branches:
      - codex/staffswipe-production-readiness

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: staffswipe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      STAFFSWIPE_TEST_DB: postgresql+psycopg://postgres:postgres@localhost:5432/staffswipe_test
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/staffswipe-production-readiness
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/bot/requirements.txt
      - name: Install focused backend test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq redis-server
          sudo service redis-server start
          python -m pip install --upgrade pip
          cd backend
          pip install -r requirements.txt -r bot/requirements.txt pytest pypdf fakeredis moto ruff
      - name: Apply minimal dispute and cancel serialization fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("backend/app/routers/matches.py")
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match, found {count}: {old[:100]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              '''    m = db.get(Match, match_id)\n    if m is None:\n        raise HTTPException(status_code=404, detail="Мэтч не найден")\n    if principal["id"] not in (m.user_id, m.employer_id):\n        raise HTTPException(status_code=403, detail="Нет доступа к мэтчу")\n    # Повторный спор по той же смене не плодит жалобы/уведомления.\n    if m.disputed:\n        return _to_out(db, m, principal["role"])\n    m.disputed = True\n    who = "работник" if principal["id"] == m.user_id else "заведение"\n''',
              '''    # Serialize dispute creation on the match row. Two workers must not both\n    # observe disputed=False and create duplicate reports/messages/notifications.\n    m = (\n        db.query(Match)\n        .filter(Match.id == match_id)\n        .with_for_update()\n        .one_or_none()\n    )\n    if m is None:\n        raise HTTPException(status_code=404, detail="Мэтч не найден")\n    is_seeker = (\n        principal["role"] == "seeker" and principal["id"] == m.user_id\n    )\n    is_employer = (\n        principal["role"] == "employer" and principal["id"] == m.employer_id\n    )\n    if not (is_seeker or is_employer):\n        raise HTTPException(status_code=403, detail="Нет доступа к мэтчу")\n    # Повторный спор по той же смене не плодит жалобы/уведомления. После\n    # row-lock конкурентный повтор дождётся первого commit и увидит True.\n    if m.disputed:\n        return _to_out(db, m, principal["role"])\n    m.disputed = True\n    who = "работник" if is_seeker else "заведение"\n''',
          )
          replace_once(
              '''    other = m.employer_id if principal["id"] == m.user_id else m.user_id\n''',
              '''    other = m.employer_id if is_seeker else m.user_id\n''',
          )
          replace_once(
              '''    m = db.get(Match, match_id)\n    if m is None:\n        raise HTTPException(status_code=404, detail="Мэтч не найден")\n    if principal["id"] not in (m.user_id, m.employer_id):\n        raise HTTPException(status_code=403, detail="Нет доступа к мэтчу")\n    if m.status in ("completed", "cancelled"):\n''',
              '''    # Cancellation changes availability and emits notifications, so one match\n    # row is the transaction boundary. A concurrent retry must observe the first\n    # cancellation before deciding whether it can mutate anything.\n    m = (\n        db.query(Match)\n        .filter(Match.id == match_id)\n        .with_for_update()\n        .one_or_none()\n    )\n    if m is None:\n        raise HTTPException(status_code=404, detail="Мэтч не найден")\n    is_seeker = (\n        principal["role"] == "seeker" and principal["id"] == m.user_id\n    )\n    is_employer = (\n        principal["role"] == "employer" and principal["id"] == m.employer_id\n    )\n    if not (is_seeker or is_employer):\n        raise HTTPException(status_code=403, detail="Нет доступа к мэтчу")\n    if m.status in ("completed", "cancelled"):\n''',
          )
          replace_once(
              '''    who = "seeker" if principal["id"] == m.user_id else "employer"\n''',
              '''    who = "seeker" if is_seeker else "employer"\n''',
          )

          path.write_text(text)
          PY
          python3 scripts/texts.py --write
      - name: Verify focused lifecycle races on PostgreSQL
        run: |
          cd backend
          ruff check app/routers/matches.py tests/test_match_lifecycle_mutation_races.py tests/test_disputes.py tests/test_cancel_shift.py
          pytest -q tests/test_match_lifecycle_mutation_races.py tests/test_disputes.py tests/test_cancel_shift.py
      - name: Commit verified fix and remove temporary workflow
        run: |
          rm .github/workflows/_tmp_fix_dispute_cancel_races.yml
          git config user.name 'staffswipe-ci'
          git config user.email 'staffswipe-ci@users.noreply.github.com'
          git add backend/app/routers/matches.py docs/ТЕКСТЫ.md .github/workflows/_tmp_fix_dispute_cancel_races.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix(lifecycle): serialize dispute and cancel mutations'
          git push origin HEAD:codex/staffswipe-production-readiness
