name: Moderation audit GREEN

on:
  push:
    branches:
      - codex/staffswipe-production-readiness
    paths:
      - .github/workflows/zz-admin-moderation-audit-green.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/staffswipe-production-readiness
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Apply moderation audit instrumentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("backend/app/routers/admin.py")
          text = path.read_text()

          old = '''def resolve_report(\n    report_id: str,\n    body: ResolveIn | None = None,\n    db: Session = Depends(get_db),\n    _admin: dict = Depends(require_admin),\n):\n'''
          new = '''def resolve_report(\n    report_id: str,\n    body: ResolveIn | None = None,\n    db: Session = Depends(get_db),\n    admin: dict = Depends(require_admin),\n):\n'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''            db.add(Message(\n                match_id=m.id, sender_id="system", is_system=True,\n                text="Оператор разобрал спор: оснований не нашлось, "\n                     "смена идёт своим чередом.",\n            ))\n    db.commit()\n'''
          new = '''            db.add(Message(\n                match_id=m.id, sender_id="system", is_system=True,\n                text="Оператор разобрал спор: оснований не нашлось, "\n                     "смена идёт своим чередом.",\n            ))\n    record_admin_action(\n        db,\n        actor_id=admin["id"],\n        action="report.resolve",\n        target_type="report",\n        target_id=report_id,\n        reason=body.reply if body else "",\n    )\n    db.commit()\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''def warn_report(\n    report_id: str,\n    body: WarnIn | None = None,\n    db: Session = Depends(get_db),\n    _admin: dict = Depends(require_admin),\n):\n'''
          new = '''def warn_report(\n    report_id: str,\n    body: WarnIn | None = None,\n    db: Session = Depends(get_db),\n    admin: dict = Depends(require_admin),\n):\n'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''    target.warnings += 1\n    rep.status = "reviewed"\n    db.commit()\n'''
          new = '''    target.warnings += 1\n    rep.status = "reviewed"\n    record_admin_action(\n        db,\n        actor_id=admin["id"],\n        action="report.warn",\n        target_type="report",\n        target_id=report_id,\n        reason=body.note if body else "",\n    )\n    db.commit()\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''class VerifyEmployerIn(BaseModel):\n    verified: bool = True\n'''
          new = '''class VerifyEmployerIn(BaseModel):\n    verified: bool = True\n    reason: str = Field(default="", max_length=1000)\n'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''def set_employer_verified(\n    employer_id: str,\n    body: VerifyEmployerIn,\n    db: Session = Depends(get_db),\n    _admin: dict = Depends(require_admin),\n):\n'''
          new = '''def set_employer_verified(\n    employer_id: str,\n    body: VerifyEmployerIn,\n    db: Session = Depends(get_db),\n    admin: dict = Depends(require_admin),\n):\n'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''    emp.verified = bool(body.verified)\n    db.commit()\n'''
          new = '''    emp.verified = bool(body.verified)\n    record_admin_action(\n        db,\n        actor_id=admin["id"],\n        action="employer.verify" if emp.verified else "employer.unverify",\n        target_type="employer",\n        target_id=employer_id,\n        reason=body.reason,\n    )\n    db.commit()\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''def block_vacancy(\n    vacancy_id: str,\n    db: Session = Depends(get_db),\n    _admin: dict = Depends(require_admin),\n):\n'''
          new = '''def block_vacancy(\n    vacancy_id: str,\n    body: AdminReasonIn | None = None,\n    db: Session = Depends(get_db),\n    admin: dict = Depends(require_admin),\n):\n'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''    v.status = "blocked"\n    _resolve_reports_for(db, vacancy_id)\n    db.commit()\n    return {"ok": True, "blocked": True}\n'''
          new = '''    v.status = "blocked"\n    _resolve_reports_for(db, vacancy_id)\n    record_admin_action(\n        db,\n        actor_id=admin["id"],\n        action="vacancy.block",\n        target_type="vacancy",\n        target_id=vacancy_id,\n        reason=body.reason if body else "",\n    )\n    db.commit()\n    return {"ok": True, "blocked": True}\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''def unblock_user(\n    user_id: str,\n    db: Session = Depends(get_db),\n    _admin: dict = Depends(require_admin),\n):\n'''
          new = '''def unblock_user(\n    user_id: str,\n    body: AdminReasonIn | None = None,\n    db: Session = Depends(get_db),\n    admin: dict = Depends(require_admin),\n):\n'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''    if isinstance(target, Employer):\n        restored = (\n            db.query(Vacancy)\n            .filter(\n                Vacancy.employer_id == user_id,\n                Vacancy.status == "blocked",\n                Vacancy.date >= local_today(),\n            )\n            .update({Vacancy.status: "active"}, synchronize_session=False)\n        )\n    db.commit()\n'''
          new = '''    if isinstance(target, Employer):\n        restored = (\n            db.query(Vacancy)\n            .filter(\n                Vacancy.employer_id == user_id,\n                Vacancy.status == "blocked",\n                Vacancy.date >= local_today(),\n            )\n            .update({Vacancy.status: "active"}, synchronize_session=False)\n        )\n    record_admin_action(\n        db,\n        actor_id=admin["id"],\n        action="user.unblock",\n        target_type="user",\n        target_id=user_id,\n        reason=body.reason if body else "",\n    )\n    db.commit()\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''def unblock_vacancy(\n    vacancy_id: str,\n    db: Session = Depends(get_db),\n    _admin: dict = Depends(require_admin),\n):\n'''
          new = '''def unblock_vacancy(\n    vacancy_id: str,\n    body: AdminReasonIn | None = None,\n    db: Session = Depends(get_db),\n    admin: dict = Depends(require_admin),\n):\n'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''    v.status = "active"\n    db.commit()\n    return {"ok": True, "blocked": False}\n'''
          new = '''    v.status = "active"\n    record_admin_action(\n        db,\n        actor_id=admin["id"],\n        action="vacancy.unblock",\n        target_type="vacancy",\n        target_id=vacancy_id,\n        reason=body.reason if body else "",\n    )\n    db.commit()\n    return {"ok": True, "blocked": False}\n'''
          assert old in text
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest ruff
      - name: Lint
        working-directory: backend
        run: ruff check app/routers/admin.py tests/test_admin_audit.py
      - name: Targeted GREEN
        working-directory: backend
        run: pytest -q tests/test_admin_audit.py
      - name: Commit verified moderation audit and clean helpers
        run: |
          rm -f .github/workflows/zz-admin-moderation-audit-red.yml
          rm -f .github/workflows/zz-admin-moderation-audit-green.yml
          git config user.name "staffswipe-ci"
          git config user.email "staffswipe-ci@users.noreply.github.com"
          git add backend/app/routers/admin.py .github/workflows/zz-admin-moderation-audit-red.yml .github/workflows/zz-admin-moderation-audit-green.yml
          git commit -m "feat: audit all moderation state changes"
          git push origin HEAD:codex/staffswipe-production-readiness
