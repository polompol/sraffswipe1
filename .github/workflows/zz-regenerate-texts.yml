name: Regenerate text catalogue

on:
  push:
    branches: [codex/staffswipe-production-readiness]
    paths: [.github/workflows/zz-regenerate-texts.yml]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/staffswipe-production-readiness
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Rebuild text catalogue
        run: python3 scripts/texts.py --write
      - name: Commit catalogue and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/zz-regenerate-texts.yml
          git config user.name staffswipe-ci
          git config user.email staffswipe-ci@users.noreply.github.com
          git add docs/ТЕКСТЫ.md .github/workflows/zz-regenerate-texts.yml
          git commit -m "docs: regenerate text catalogue for lifecycle guards"
          git push origin HEAD:codex/staffswipe-production-readiness
