name: TMA CI

on:
  push:
    branches: ["**"]
    paths: ["tma/**", ".github/workflows/tma.yml"]
  # Release-gate contract: every PR head must have fresh TMA evidence even
  # when the commit itself only changes backend/ops/docs files.
  pull_request:

jobs:
  build:
    name: Typecheck & build (Telegram Mini App)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tma
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tma/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
