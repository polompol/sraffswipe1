name: Temporary verify lifecycle confirm race fix

on:
  push:
    branches:
      - codex/staffswipe-production-readiness
    paths:
      - .github/workflows/_tmp_fix_confirm_race.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: staffswipe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      STAFFSWIPE_TEST_DB: postgresql+psycopg://postgres:postgres@localhost:5432/staffswipe_test
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/staffswipe-production-readiness
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/bot/requirements.txt
      - name: Install backend test dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r bot/requirements.txt pytest pypdf fakeredis moto
      - name: Apply the minimal confirm serialization fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/routers/matches.py')
          text = path.read_text()
          old = '''    m = db.get(Match, match_id)
              if m is None:
                  raise HTTPException(status_code=404, detail="Мэтч не найден")
              # Подтверждать может только участник мэтча.
              if principal["id"] not in (m.user_id, m.employer_id):
                  raise HTTPException(status_code=403, detail="Нет доступа к мэтчу")
              if m.status in {"cancelled", "completed", "expired"}:
                  raise HTTPException(
                      status_code=409,
                      detail="Эта смена уже закрыта — подтверждать её нельзя",
                  )
              if principal["role"] == "seeker":
          '''
          new = '''    # Serialize both participants on the same match row. Without a row lock,
              # simultaneous seeker/employer confirms could each read both flags as false,
              # persist their own flag, and leave the final status stuck at `matched`.
              m = (
                  db.query(Match)
                  .filter(Match.id == match_id)
                  .with_for_update()
                  .one_or_none()
              )
              if m is None:
                  raise HTTPException(status_code=404, detail="Мэтч не найден")

              # Authorization is a role+identity pair, not merely "one of these IDs".
              # This prevents a token carrying the wrong role from crossing sides.
              is_seeker = (
                  principal["role"] == "seeker" and principal["id"] == m.user_id
              )
              is_employer = (
                  principal["role"] == "employer" and principal["id"] == m.employer_id
              )
              if not (is_seeker or is_employer):
                  raise HTTPException(status_code=403, detail="Нет доступа к мэтчу")
              if m.status in {"cancelled", "completed", "expired"}:
                  raise HTTPException(
                      status_code=409,
                      detail="Эта смена уже закрыта — подтверждать её нельзя",
                  )

              # Repeated taps/retries by the same side are an idempotent no-op. In
              # particular, do not resend the employer notification while waiting for
              # the second participant.
              if (is_seeker and m.confirmed_by_seeker) or (
                  is_employer and m.confirmed_by_employer
              ):
                  return _to_out(db, m, principal["role"])

              if is_seeker:
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one confirm block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Run focused lifecycle tests on PostgreSQL
        working-directory: backend
        run: |
          pytest -q \
            tests/test_match_confirm_real_concurrency.py \
            tests/test_match_lifecycle_authorization.py \
            tests/test_match_lifecycle_policy.py
      - name: Remove temporary workflow and commit verified fix
        run: |
          rm .github/workflows/_tmp_fix_confirm_race.yml
          git config user.name "staffswipe-ci"
          git config user.email "staffswipe-ci@users.noreply.github.com"
          git add backend/app/routers/matches.py .github/workflows/_tmp_fix_confirm_race.yml
          git commit -m "fix(lifecycle): serialize two-sided confirmation"
          git push origin HEAD:codex/staffswipe-production-readiness
