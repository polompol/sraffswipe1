name: Dispute verdict final matrix rerun

on:
  push:
    branches:
      - codex/staffswipe-production-readiness
    paths:
      - .github/workflows/zz-dispute-final-matrix.yml

permissions:
  contents: write

jobs:
  sqlite:
    name: SQLite full backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/bot/requirements.txt
      - name: Redis
        run: sudo apt-get update -qq && sudo apt-get install -y -qq redis-server
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r bot/requirements.txt ruff pytest pypdf fakeredis moto
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  postgres:
    name: PostgreSQL full backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: staffswipe_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/bot/requirements.txt
      - name: Redis
        run: sudo apt-get update -qq && sudo apt-get install -y -qq redis-server
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r bot/requirements.txt pytest pypdf fakeredis moto
      - name: Test
        env:
          STAFFSWIPE_TEST_DB: postgresql+psycopg://postgres:postgres@localhost:5432/staffswipe_test
        run: pytest -q

  cleanup:
    name: Remove helper workflow
    needs: [sqlite, postgres]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/staffswipe-production-readiness
          fetch-depth: 0
      - name: Remove helper
        run: |
          rm -f .github/workflows/zz-dispute-final-matrix.yml
          git config user.name "staffswipe-ci"
          git config user.email "staffswipe-ci@users.noreply.github.com"
          git add .github/workflows/zz-dispute-final-matrix.yml
          git commit -m "ci: remove dispute final matrix helper"
          git push origin HEAD:codex/staffswipe-production-readiness
