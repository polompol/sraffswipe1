name: E2E

# Сквозные проверки в настоящем браузере: живой бэкенд + собранное
# приложение. Запускаются, когда меняется что-то из того, что они трогают, —
# то есть почти всегда, кроме правок документации.
on:
  push:
    branches: ["**"]
    paths: ["e2e/**", "tma/**", "backend/**", ".github/workflows/e2e.yml"]
  pull_request:
    paths: ["e2e/**", "tma/**", "backend/**", ".github/workflows/e2e.yml"]

jobs:
  browser:
    name: Оба пути в браузере
    runs-on: ubuntu-latest
    # Прогон поднимает сервер, собирает приложение и запускает браузер.
    # Если что-то зависнет — падаем сами, а не висим час.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend
        run: pip install -r backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            tma/package-lock.json
            e2e/package-lock.json

      - name: Install app
        working-directory: tma
        run: npm ci

      - name: Install e2e
        working-directory: e2e
        run: npm ci

      # Только chromium: приложение живёт внутри Telegram, а его вебвью и на
      # андроиде, и на айфоне ближе всего к нему. Три браузера тут были бы
      # тремя прогонами ради одного результата.
      - name: Install browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run
        working-directory: e2e
        run: npx playwright test

      # Отчёт нужен ровно тогда, когда что-то упало: по нему видно кадр, след
      # и запись экрана — без этого разбирать чужое падение почти невозможно.
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
