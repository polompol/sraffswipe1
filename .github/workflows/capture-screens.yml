name: Capture current UI screens

on:
  push:
    branches: ["screen-capture"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            tma/package-lock.json
            e2e/package-lock.json

      - name: Install app
        working-directory: tma
        run: npm ci

      - name: Install Playwright
        working-directory: e2e
        run: npm ci

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Capture every route
        working-directory: e2e
        run: npx playwright test --config=playwright.screens.config.ts

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: staffswipe-current-screens
          path: e2e/screenshots/
          retention-days: 7
