name: Dispute verdict race GREEN retry

on:
  push:
    branches:
      - codex/staffswipe-production-readiness
    paths:
      - .github/workflows/zz-dispute-race-green.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: staffswipe_verdict_green
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/staffswipe-production-readiness
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Apply bounded DB compare-and-set patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("backend/app/routers/matches.py")
          text = path.read_text()
          old = '''    if not m.disputed:\n        raise HTTPException(\n            status_code=409,\n            detail="Спор уже закрыт или не был открыт",\n        )\n    if body.outcome not in {"completed", "no_show"}:\n        raise HTTPException(status_code=400, detail="outcome: completed|no_show")\n\n    m.disputed = False\n'''
          new = '''    if body.outcome not in {"completed", "no_show"}:\n        raise HTTPException(status_code=400, detail="outcome: completed|no_show")\n    if not m.disputed:\n        raise HTTPException(\n            status_code=409,\n            detail="Спор уже закрыт или не был открыт",\n        )\n\n    # БД, а не ORM-кэш, решает, кто первым закрыл спор. Два воркера могут\n    # одновременно прочитать disputed=True; conditional UPDATE пропустит\n    # только одного. Если дальнейший вердикт упадёт, тот же transaction\n    # откатит и claim, поэтому спор не потеряется.\n    claimed = (\n        db.query(Match)\n        .filter(Match.id == match_id, Match.disputed.is_(True))\n        .update({Match.disputed: False}, synchronize_session=False)\n    )\n    if claimed != 1:\n        raise HTTPException(\n            status_code=409,\n            detail="Спор уже закрыт или не был открыт",\n        )\n    # synchronize_session=False намеренно не трогает stale identity map.\n    # Синхронизируем локальный объект явно, чтобы последующий flush не смог\n    # вернуть disputed=True обратно в базу.\n    m.disputed = False\n'''
          assert text.count(old) == 1, "resolve block changed unexpectedly"
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest ruff fakeredis
      - name: Verify patch scope
        run: |
          git diff -- backend/app/routers/matches.py
          test "$(git diff --numstat -- backend/app/routers/matches.py | awk '{print $1+$2}')" -lt 50
      - name: Lint
        working-directory: backend
        run: ruff check app/routers/matches.py tests/test_disputes.py tests/test_dispute_verdict_concurrency.py
      - name: SQLite targeted GREEN
        working-directory: backend
        run: pytest -q tests/test_disputes.py tests/test_dispute_verdict_concurrency.py
      - name: PostgreSQL targeted GREEN
        working-directory: backend
        env:
          STAFFSWIPE_TEST_DB: postgresql+psycopg://postgres:postgres@localhost:5432/staffswipe_verdict_green
        run: pytest -q tests/test_disputes.py tests/test_dispute_verdict_concurrency.py
      - name: Commit verified patch and remove helpers
        run: |
          rm -f .github/workflows/zz-dispute-race-red.yml
          rm -f .github/workflows/zz-dispute-race-green.yml
          git config user.name "staffswipe-ci"
          git config user.email "staffswipe-ci@users.noreply.github.com"
          git add backend/app/routers/matches.py .github/workflows/zz-dispute-race-red.yml .github/workflows/zz-dispute-race-green.yml
          git commit -m "fix: claim dispute verdict atomically"
          git push origin HEAD:codex/staffswipe-production-readiness
