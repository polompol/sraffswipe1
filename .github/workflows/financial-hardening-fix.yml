name: Final financial hardening fix

on:
  push:
    branches:
      - codex/staffswipe-financial-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/staffswipe-financial-hardening
          fetch-depth: 0
      - name: Patch SQLite refund claim and refresh catalogue
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('backend/app/financial_hardening.py')
          src = path.read_text()
          old = '''    # Claim request_id first.  Under concurrency the unique constraint makes
              # one request the winner before either is allowed to mutate money.
              refund = PaymentRefund(
                  purchase_id=purchase.id,
                  owner_id=purchase.owner_id,
                  request_id=request_id,
                  amount=body.amount_rub,
                  status="pending",
                  note=body.note,
                  actor_id=str(admin.get("id") or "admin"),
              )
              try:
                  with db.begin_nested():
                      db.add(refund)
                      db.flush()
              except IntegrityError:
                  existing = (
                      db.query(PaymentRefund)
                      .filter(PaymentRefund.request_id == request_id)
                      .first()
                  )
                  if existing is None:
                      raise
                  return _existing_refund_response(existing, purchase_id, body.amount_rub)
          '''
          new = '''    # Claim request_id first.  Under concurrency the unique constraint makes
              # one request the winner before either is allowed to mutate money. SQLite's
              # legacy transaction mode needs the claim itself to be a real DML statement;
              # otherwise an outerless SAVEPOINT can survive a later rollback and leave a
              # phantom pending refund after a 409.
              refund_values = {
                  "id": str(uuid4()),
                  "purchase_id": purchase.id,
                  "owner_id": purchase.owner_id,
                  "request_id": request_id,
                  "amount": body.amount_rub,
                  "status": "pending",
                  "note": body.note,
                  "actor_id": str(admin.get("id") or "admin"),
              }
              if db.get_bind().dialect.name == "sqlite":
                  from sqlalchemy.dialects.sqlite import insert as sqlite_insert

                  claimed = db.execute(
                      sqlite_insert(PaymentRefund)
                      .values(**refund_values)
                      .on_conflict_do_nothing(index_elements=["request_id"])
                  )
                  if claimed.rowcount != 1:
                      existing = (
                          db.query(PaymentRefund)
                          .filter(PaymentRefund.request_id == request_id)
                          .first()
                      )
                      if existing is None:
                          raise HTTPException(
                              status_code=409,
                              detail="Не удалось захватить request_id возврата",
                          )
                      return _existing_refund_response(
                          existing, purchase_id, body.amount_rub
                      )
              else:
                  refund = PaymentRefund(**refund_values)
                  try:
                      with db.begin_nested():
                          db.add(refund)
                          db.flush()
                  except IntegrityError:
                      existing = (
                          db.query(PaymentRefund)
                          .filter(PaymentRefund.request_id == request_id)
                          .first()
                      )
                      if existing is None:
                          raise
                      return _existing_refund_response(
                          existing, purchase_id, body.amount_rub
                      )
          '''
          if old not in src:
              raise SystemExit('expected refund-claim block not found')
          path.write_text(src.replace(old, new, 1))
          PY
          python3 scripts/texts.py --write
      - name: Commit patch
        run: |
          if git diff --quiet -- backend/app/financial_hardening.py docs/ТЕКСТЫ.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/financial_hardening.py docs/ТЕКСТЫ.md
          git commit -m "fix: keep failed refund claims transactional"
          git push origin HEAD:codex/staffswipe-financial-hardening
