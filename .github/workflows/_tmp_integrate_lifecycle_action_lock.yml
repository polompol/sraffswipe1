name: Temporary integrate lifecycle action lock

on:
  push:
    branches:
      - codex/staffswipe-production-readiness

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/staffswipe-production-readiness
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tma/package-lock.json
      - name: Integrate action runner into lifecycle controls
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          matches = "tma/src/features/matches/MatchesPage.tsx"
          replace_once(
              matches,
              'import { hasMatchAction } from "./matchActions";\n',
              'import { hasMatchAction } from "./matchActions";\nimport { useMatchActionRunner } from "./useMatchActionRunner";\n',
          )
          replace_once(
              matches,
              '  const role = useSession((s) => s.role);\n  const [params, setParams] = useSearchParams();\n',
              '  const role = useSession((s) => s.role);\n  const actionRunner = useMatchActionRunner();\n  const [params, setParams] = useSearchParams();\n',
          )
          replace_once(
              matches,
              '''  async function mark(matchId: string, attended: boolean) {\n    haptic(attended ? "success" : "warning");\n    try {\n      await markAttendance(matchId, attended);\n      toast(attended ? "Отметили: человек вышел ✓" : "Отмечено: не вышел", "success");\n      qc.invalidateQueries({ queryKey: ["matches"] });\n    } catch {\n      toast("Не отметилось — проверьте связь и нажмите ещё раз", "error");\n    }\n  }\n''',
              '''  async function mark(matchId: string, attended: boolean) {\n    try {\n      await actionRunner.run(matchId, "attendance", async () => {\n        haptic(attended ? "success" : "warning");\n        await markAttendance(matchId, attended);\n        toast(attended ? "Отметили: человек вышел ✓" : "Отмечено: не вышел", "success");\n        qc.invalidateQueries({ queryKey: ["matches"] });\n      });\n    } catch {\n      toast("Не отметилось — проверьте связь и нажмите ещё раз", "error");\n    }\n  }\n''',
          )
          replace_once(
              matches,
              '''  async function doCheckin(matchId: string) {\n    const code = (codes[matchId] ?? "").trim();\n    if (code.length < 6) return;\n    try {\n      await checkinShift(matchId, { code });\n      haptic("success");\n      toast("Вы отметились на смене ✓", "success");\n      setCodes((c) => ({ ...c, [matchId]: "" }));\n      qc.invalidateQueries({ queryKey: ["matches"] });\n    } catch {\n      haptic("error");\n      toast("Код не подошёл — проверьте цифры у администратора", "error");\n    }\n  }\n''',
              '''  async function doCheckin(matchId: string) {\n    const code = (codes[matchId] ?? "").trim();\n    if (code.length < 6) return;\n    try {\n      await actionRunner.run(matchId, "checkin", async () => {\n        await checkinShift(matchId, { code });\n        haptic("success");\n        toast("Вы отметились на смене ✓", "success");\n        setCodes((c) => ({ ...c, [matchId]: "" }));\n        qc.invalidateQueries({ queryKey: ["matches"] });\n      });\n    } catch {\n      haptic("error");\n      toast("Код не подошёл — проверьте цифры у администратора", "error");\n    }\n  }\n''',
          )
          replace_once(
              matches,
              '''  async function doNotPaid(matchId: string) {\n    if (!(await confirmAction(\n      "Заведение не рассчиталось за смену? Оператор свяжется с обеими сторонами и разберётся.",\n      "Пожаловаться",\n    ))) return;\n    haptic("warning");\n    try {\n      await disputeShift(matchId, "Не заплатили за смену");\n      toast("Жалоба у оператора — он скоро напишет", "success");\n      qc.invalidateQueries({ queryKey: ["matches"] });\n    } catch {\n      toast("Жалоба не ушла — попробуйте ещё раз", "error");\n    }\n  }\n''',
              '''  async function doNotPaid(matchId: string) {\n    if (!(await confirmAction(\n      "Заведение не рассчиталось за смену? Оператор свяжется с обеими сторонами и разберётся.",\n      "Пожаловаться",\n    ))) return;\n    try {\n      await actionRunner.run(matchId, "dispute", async () => {\n        haptic("warning");\n        await disputeShift(matchId, "Не заплатили за смену");\n        toast("Жалоба у оператора — он скоро напишет", "success");\n        qc.invalidateQueries({ queryKey: ["matches"] });\n      });\n    } catch {\n      toast("Жалоба не ушла — попробуйте ещё раз", "error");\n    }\n  }\n''',
          )
          replace_once(
              matches,
              '''  async function doDispute(matchId: string) {\n    if (!(await confirmAction(\n      "Позвать оператора по этой смене? Он свяжется с обеими сторонами.",\n      "Позвать оператора",\n    ))) return;\n    haptic("warning");\n    try {\n      await disputeShift(matchId);\n      toast("Оператор получил заявку — скоро напишет", "success");\n      qc.invalidateQueries({ queryKey: ["matches"] });\n    } catch {\n      toast("Не получилось позвать оператора — попробуйте ещё раз", "error");\n    }\n  }\n''',
              '''  async function doDispute(matchId: string) {\n    if (!(await confirmAction(\n      "Позвать оператора по этой смене? Он свяжется с обеими сторонами.",\n      "Позвать оператора",\n    ))) return;\n    try {\n      await actionRunner.run(matchId, "dispute", async () => {\n        haptic("warning");\n        await disputeShift(matchId);\n        toast("Оператор получил заявку — скоро напишет", "success");\n        qc.invalidateQueries({ queryKey: ["matches"] });\n      });\n    } catch {\n      toast("Не получилось позвать оператора — попробуйте ещё раз", "error");\n    }\n  }\n''',
          )
          replace_once(
              matches,
              '''  async function doNotHeld(matchId: string) {\n    const ok = await confirmAction(\n      "Отметить, что смена не состоялась? Комиссию за неё не возьмём.",\n      "Смена не состоялась",\n    );\n    if (!ok) return;\n    haptic("warning");\n    try {\n      await markNotHeld(matchId);\n      toast("Отмечено: смена не состоялась", "success");\n      qc.invalidateQueries({ queryKey: ["matches"] });\n    } catch (e) {\n      haptic("error");\n      toast(apiError(e, "Не получилось отметить — попробуйте ещё раз"), "error");\n    }\n  }\n''',
              '''  async function doNotHeld(matchId: string) {\n    const ok = await confirmAction(\n      "Отметить, что смена не состоялась? Комиссию за неё не возьмём.",\n      "Смена не состоялась",\n    );\n    if (!ok) return;\n    try {\n      await actionRunner.run(matchId, "not_held", async () => {\n        haptic("warning");\n        await markNotHeld(matchId);\n        toast("Отмечено: смена не состоялась", "success");\n        qc.invalidateQueries({ queryKey: ["matches"] });\n      });\n    } catch (e) {\n      haptic("error");\n      toast(apiError(e, "Не получилось отметить — попробуйте ещё раз"), "error");\n    }\n  }\n''',
          )
          replace_once(
              matches,
              '''                      <Button onClick={() => mark(m.id, true)}>\n                        <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>\n                          <IconCheck size={16} /> Подтвердить выход\n                        </span>\n                      </Button>\n''',
              '''                      <Button\n                        disabled={actionRunner.isPending(m.id, "attendance")}\n                        onClick={() => mark(m.id, true)}\n                      >\n                        <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>\n                          <IconCheck size={16} />\n                          {actionRunner.isPending(m.id, "attendance") ? "Отмечаем…" : "Подтвердить выход"}\n                        </span>\n                      </Button>\n''',
          )
          replace_once(
              matches,
              '''                      <Button\n                        block={false}\n                        disabled={(codes[m.id] ?? "").length < 6}\n                        onClick={() => doCheckin(m.id)}\n                      >\n                        Отметиться\n                      </Button>\n''',
              '''                      <Button\n                        block={false}\n                        disabled={(codes[m.id] ?? "").length < 6 || actionRunner.isPending(m.id, "checkin")}\n                        onClick={() => doCheckin(m.id)}\n                      >\n                        {actionRunner.isPending(m.id, "checkin") ? "Отмечаем…" : "Отметиться"}\n                      </Button>\n''',
          )

          chat = "tma/src/features/chat/ChatPage.tsx"
          replace_once(
              chat,
              'import { hasMatchAction } from "@/features/matches/matchActions";\n',
              'import { hasMatchAction } from "@/features/matches/matchActions";\nimport { useMatchActionRunner } from "@/features/matches/useMatchActionRunner";\n',
          )
          replace_once(
              chat,
              '  const role = useSession((s) => s.role);\n  const chatUserId = myId ?? "me";\n',
              '  const role = useSession((s) => s.role);\n  const actionRunner = useMatchActionRunner();\n  const chatUserId = myId ?? "me";\n',
          )
          replace_once(
              chat,
              '''  async function saveHours() {\n    const minutes = Math.round(parseFloat(hoursValue.replace(",", ".")) * 60);\n    try {\n      const m = await setActualHours(matchId, minutes, hoursNote.trim());\n      haptic("success");\n      setMatchState(m);\n      setHoursOpen(false);\n      toast("Часы сохранили — работник уже видит", "success");\n      qc.invalidateQueries({ queryKey: ["messages", matchId] });\n    } catch (e: any) {\n      haptic("error");\n      toast(apiError(e, "Часы не сохранились — попробуйте ещё раз"), "error");\n    }\n  }\n''',
              '''  async function saveHours() {\n    const minutes = Math.round(parseFloat(hoursValue.replace(",", ".")) * 60);\n    try {\n      await actionRunner.run(matchId, "set_hours", async () => {\n        const m = await setActualHours(matchId, minutes, hoursNote.trim());\n        haptic("success");\n        setMatchState(m);\n        setHoursOpen(false);\n        toast("Часы сохранили — работник уже видит", "success");\n        qc.invalidateQueries({ queryKey: ["messages", matchId] });\n      });\n    } catch (e: any) {\n      haptic("error");\n      toast(apiError(e, "Часы не сохранились — попробуйте ещё раз"), "error");\n    }\n  }\n''',
          )
          replace_once(
              chat,
              '''  async function proposeMove() {\n    try {\n      const m = await proposeReschedule(\n        matchId, moveDate, toMinutes(moveStart), toMinutes(moveEnd));\n      haptic("success");\n      setMatchState(m);\n      setMoveOpen(false);\n      toast("Предложили перенос — ждём ответа", "success");\n      qc.invalidateQueries({ queryKey: ["messages", matchId] });\n    } catch (e: any) {\n      haptic("error");\n      toast(apiError(e, "Перенос не предложился — попробуйте ещё раз"), "error");\n    }\n  }\n''',
              '''  async function proposeMove() {\n    try {\n      await actionRunner.run(matchId, "propose_reschedule", async () => {\n        const m = await proposeReschedule(\n          matchId, moveDate, toMinutes(moveStart), toMinutes(moveEnd));\n        haptic("success");\n        setMatchState(m);\n        setMoveOpen(false);\n        toast("Предложили перенос — ждём ответа", "success");\n        qc.invalidateQueries({ queryKey: ["messages", matchId] });\n      });\n    } catch (e: any) {\n      haptic("error");\n      toast(apiError(e, "Перенос не предложился — попробуйте ещё раз"), "error");\n    }\n  }\n''',
          )
          replace_once(
              chat,
              '''  async function answerMove(accept: boolean) {\n    try {\n      const m = await answerReschedule(matchId, accept);\n      haptic(accept ? "success" : "warning");\n      setMatchState(m);\n      toast(accept ? "Смена перенесена ✓" : "Ответили: выйти не сможете", "success");\n      qc.invalidateQueries({ queryKey: ["messages", matchId] });\n      qc.invalidateQueries({ queryKey: ["matches"] });\n    } catch {\n      haptic("error");\n      toast("Ответ не ушёл — попробуйте ещё раз", "error");\n    }\n  }\n''',
              '''  async function answerMove(accept: boolean) {\n    const action = accept ? "accept_reschedule" : "decline_reschedule";\n    try {\n      await actionRunner.run(matchId, action, async () => {\n        const m = await answerReschedule(matchId, accept);\n        haptic(accept ? "success" : "warning");\n        setMatchState(m);\n        toast(accept ? "Смена перенесена ✓" : "Ответили: выйти не сможете", "success");\n        qc.invalidateQueries({ queryKey: ["messages", matchId] });\n        qc.invalidateQueries({ queryKey: ["matches"] });\n      });\n    } catch {\n      haptic("error");\n      toast("Ответ не ушёл — попробуйте ещё раз", "error");\n    }\n  }\n''',
          )
          replace_once(
              chat,
              '''  async function doCancel() {\n    try {\n      const m = await cancelShift(matchId, cancelReason.trim());\n      haptic("warning");\n      setMatchState(m);\n      setCancelOpen(false);\n      setCancelReason("");\n      toast(\n        role === "employer"\n          ? "Смена отменена — работник уже знает"\n          : "Смена отменена — заведение уже знает",\n        "success",\n      );\n      qc.invalidateQueries({ queryKey: ["messages", matchId] });\n      qc.invalidateQueries({ queryKey: ["matches"] });\n    } catch (e: any) {\n      haptic("error");\n      toast(\n        apiError(e, "Смена не отменилась — попробуйте ещё раз"),\n        "error",\n      );\n    }\n  }\n''',
              '''  async function doCancel() {\n    try {\n      await actionRunner.run(matchId, "cancel", async () => {\n        const m = await cancelShift(matchId, cancelReason.trim());\n        haptic("warning");\n        setMatchState(m);\n        setCancelOpen(false);\n        setCancelReason("");\n        toast(\n          role === "employer"\n            ? "Смена отменена — работник уже знает"\n            : "Смена отменена — заведение уже знает",\n          "success",\n        );\n        qc.invalidateQueries({ queryKey: ["messages", matchId] });\n        qc.invalidateQueries({ queryKey: ["matches"] });\n      });\n    } catch (e: any) {\n      haptic("error");\n      toast(\n        apiError(e, "Смена не отменилась — попробуйте ещё раз"),\n        "error",\n      );\n    }\n  }\n''',
          )
          replace_once(
              chat,
              '''  async function doConfirm(force = false) {\n    try {\n      const m = await confirmShift(matchId, force);\n      track("confirm");\n      haptic("success");\n      coin();\n      setMatchState(m);\n      toast(\n        m.confirmedBySeeker && m.confirmedByEmployer\n          ? "Договорились ✓ Смена подтверждена"\n          : role === "employer"\n            ? "Готово! Ждём, когда работник подтвердит"\n            : "Готово! Ждём, когда заведение подтвердит",\n        "success",\n      );\n      qc.invalidateQueries({ queryKey: ["messages", matchId] });\n      qc.invalidateQueries({ queryKey: ["matches"] });\n    } catch (e) {\n''',
              '''  async function doConfirm(force = false) {\n    try {\n      await actionRunner.run(matchId, "confirm", async () => {\n        const m = await confirmShift(matchId, force);\n        track("confirm");\n        haptic("success");\n        coin();\n        setMatchState(m);\n        toast(\n          m.confirmedBySeeker && m.confirmedByEmployer\n            ? "Договорились ✓ Смена подтверждена"\n            : role === "employer"\n              ? "Готово! Ждём, когда работник подтвердит"\n              : "Готово! Ждём, когда заведение подтвердит",\n          "success",\n        );\n        qc.invalidateQueries({ queryKey: ["messages", matchId] });\n        qc.invalidateQueries({ queryKey: ["matches"] });\n      });\n    } catch (e) {\n''',
          )
          replace_once(
              chat,
              '''            disabled={useBackend ? !canConfirm : iConfirmed}\n            onClick={() => doConfirm()}\n          >\n            <span className="inline">\n              <IconCheck size={17} />\n              {/* Без второй галочки в тексте: слева уже стоит иконка, и\n                  вместе получалось «✓ Смена подтверждена ✓». */}\n              {bothConfirmed\n                ? "Смена подтверждена"\n                : iConfirmed\n                  ? role === "employer"\n                    ? "Ждём ответа работника"\n                    : "Ждём ответа заведения"\n                  : "Подтвердить смену"}\n''',
              '''            disabled={actionRunner.isPending(matchId, "confirm") || (useBackend ? !canConfirm : iConfirmed)}\n            onClick={() => doConfirm()}\n          >\n            <span className="inline">\n              <IconCheck size={17} />\n              {/* Без второй галочки в тексте: слева уже стоит иконка, и\n                  вместе получалось «✓ Смена подтверждена ✓». */}\n              {actionRunner.isPending(matchId, "confirm")\n                ? "Подтверждаем…"\n                : bothConfirmed\n                  ? "Смена подтверждена"\n                  : iConfirmed\n                    ? role === "employer"\n                      ? "Ждём ответа работника"\n                      : "Ждём ответа заведения"\n                    : "Подтвердить смену"}\n''',
          )
          replace_once(
              chat,
              '<Button onClick={() => answerMove(true)}>Подходит</Button>\n',
              '<Button disabled={actionRunner.isPending(matchId, "accept_reschedule")} onClick={() => answerMove(true)}>{actionRunner.isPending(matchId, "accept_reschedule") ? "Сохраняем…" : "Подходит"}</Button>\n',
          )
          replace_once(
              chat,
              '''                  <Button variant="ghost" onClick={() => answerMove(false)}>\n                    Не смогу\n                  </Button>\n''',
              '''                  <Button\n                    variant="ghost"\n                    disabled={actionRunner.isPending(matchId, "decline_reschedule")}\n                    onClick={() => answerMove(false)}\n                  >\n                    {actionRunner.isPending(matchId, "decline_reschedule") ? "Отправляем…" : "Не смогу"}\n                  </Button>\n''',
          )
          replace_once(
              chat,
              '<Button block onClick={saveHours}>Сохранить часы</Button>\n',
              '<Button block disabled={actionRunner.isPending(matchId, "set_hours")} onClick={saveHours}>{actionRunner.isPending(matchId, "set_hours") ? "Сохраняем…" : "Сохранить часы"}</Button>\n',
          )
          replace_once(
              chat,
              '''              <Button block disabled={!moveDate} onClick={proposeMove}>\n                Предложить перенос\n              </Button>\n''',
              '''              <Button block disabled={!moveDate || actionRunner.isPending(matchId, "propose_reschedule")} onClick={proposeMove}>\n                {actionRunner.isPending(matchId, "propose_reschedule") ? "Отправляем…" : "Предложить перенос"}\n              </Button>\n''',
          )
          replace_once(
              chat,
              '''              <Button variant="danger" block onClick={doCancel}>\n                Отменить смену\n              </Button>\n''',
              '''              <Button variant="danger" block disabled={actionRunner.isPending(matchId, "cancel")} onClick={doCancel}>\n                {actionRunner.isPending(matchId, "cancel") ? "Отменяем…" : "Отменить смену"}\n              </Button>\n''',
          )
          replace_once(
              chat,
              '''              <Button\n                block\n                onClick={() => {\n                  setConflict(null);\n                  void doConfirm(true);\n                }}\n              >\n                Всё равно беру\n              </Button>\n''',
              '''              <Button\n                block\n                disabled={actionRunner.isPending(matchId, "confirm")}\n                onClick={() => {\n                  setConflict(null);\n                  void doConfirm(true);\n                }}\n              >\n                {actionRunner.isPending(matchId, "confirm") ? "Подтверждаем…" : "Всё равно беру"}\n              </Button>\n''',
          )
          PY
      - name: Verify Telegram Mini App
        working-directory: tma
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test -- --run
          npm run build
      - name: Commit verified integration and remove temporary workflow
        run: |
          rm .github/workflows/_tmp_integrate_lifecycle_action_lock.yml
          git config user.name 'staffswipe-ci'
          git config user.email 'staffswipe-ci@users.noreply.github.com'
          git add tma/src/features/matches/MatchesPage.tsx tma/src/features/chat/ChatPage.tsx .github/workflows/_tmp_integrate_lifecycle_action_lock.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix(lifecycle): guard UI mutations against double taps'
          git push origin HEAD:codex/staffswipe-production-readiness
