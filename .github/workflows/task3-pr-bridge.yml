name: Apply Task 3 patch on PR

on:
  pull_request:
    branches:
      - codex/staffswipe-release-candidate

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'codex/staffswipe-production-readiness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/staffswipe-production-readiness
          fetch-depth: 0

      - name: Execute guarded patch body
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          raw = Path('.github/workflows/task3-patch.yml').read_text(encoding='utf-8')
          start = "      - name: Apply guarded contract and UX fixes\n        shell: bash\n        run: |\n"
          end = "\n      - name: Commit guarded patch and remove runner\n"
          if raw.count(start) != 1 or raw.count(end) != 1:
              raise SystemExit('guarded patch markers are not unique')
          body = raw.split(start, 1)[1].split(end, 1)[0]
          subprocess.run(['bash', '-euo', 'pipefail', '-c', textwrap.dedent(body)], check=True)
          PY

      - name: Commit guarded patch and remove temporary runners
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/task3-patch.yml .github/workflows/task3-pr-bridge.yml
          git add backend/tests tma/src/api/endpoints.ts tma/src/features/admin/TodayTab.tsx e2e/tests/admin.spec.ts docs/ТЕКСТЫ.md
          git diff --cached --check
          git commit -m "fix: complete destructive admin action hardening"
          git push origin HEAD:codex/staffswipe-production-readiness
