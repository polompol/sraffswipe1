name: Dispute verdict race RED

on:
  push:
    branches:
      - codex/staffswipe-production-readiness
    paths:
      - .github/workflows/zz-dispute-race-red.yml

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest fakeredis
      - name: Run strict stale-session verdict contract
        working-directory: backend
        run: pytest -q tests/test_dispute_verdict_concurrency.py
